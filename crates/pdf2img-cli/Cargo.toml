[package]
name = "pdf2img-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI tool for PDF to image conversion"

[[bin]]
name = "pdf2img"
path = "src/main.rs"

[[bin]]
name = "file-benchmark"
path = "../../test/file-benchmark.rs"

[[bin]]
name = "stream-benchmark"
path = "../../test/stream-benchmark.rs"

[[bin]]
name = "manual-test"
path = "../../test/manual-test.rs"

[dependencies]
pdf2img-core = { path = "../pdf2img-core" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
